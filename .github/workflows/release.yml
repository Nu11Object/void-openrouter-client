name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_DRAFT: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^app\.version=' gradle.properties | cut -d= -f2-)"
          VERSION="${VERSION//[[:space:]]/}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app.version must be MAJOR.MINOR.PATCH (digits only), got '$VERSION'"
            exit 1
          fi

          TAG=""
          PRERELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" == "v${VERSION}" ]]; then
              PRERELEASE=false
            elif [[ "$TAG" == "v${VERSION}-"?* ]]; then
              PRERELEASE=true
            else
              echo "::error::Tag '$TAG' does not match app.version '$VERSION' (expected v$VERSION or v$VERSION-<suffix>)"
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop-windows-x64
            gradle_tasks: ":desktopApp:packageMsi"
            extensions: "msi"
          - os: macos-latest
            artifact: desktop-macos-arm64
            gradle_tasks: ":desktopApp:packageDmg"
            extensions: "dmg"
          - os: ubuntu-24.04
            artifact: desktop-linux-x64
            gradle_tasks: ":desktopApp:packageDeb :desktopApp:packageRpm"
            extensions: "deb rpm"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Build desktop packages
        run: ./gradlew ${{ matrix.gradle_tasks }}

      - name: Collect desktop packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for ext in ${{ matrix.extensions }}; do
            case "$ext" in
              msi) name="Void-${{ needs.prepare.outputs.version }}-windows-x64.msi" ;;
              dmg) name="Void-${{ needs.prepare.outputs.version }}-macos-arm64.dmg" ;;
              deb) name="Void-${{ needs.prepare.outputs.version }}-linux-x64.deb" ;;
              rpm) name="Void-${{ needs.prepare.outputs.version }}-linux-x64.rpm" ;;
            esac
            found="$(find desktopApp/build/compose/binaries -type f -name "*.$ext")"
            count="$(printf '%s' "$found" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one .$ext file, found $count"
              exit 1
            fi
            cp "$found" "dist/$name"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 3

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voidapp-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/voidapp-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          ./gradlew :androidApp:assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          found="$(find androidApp/build/outputs/apk/release -type f -name '*.apk')"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found $count"
            exit 1
          fi
          cp "$found" "dist/Void-${{ needs.prepare.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-universal
          path: dist/Void-*-android.apk
          retention-days: 3

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APPS=("$RUNNER_TEMP/App.xcarchive/Products/Applications"/*.app)
          if [ "${#APPS[@]}" -ne 1 ] || [ ! -d "${APPS[0]}" ]; then
            echo "::error::Expected exactly one .app in the archive"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "${APPS[0]}" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/Void-$VERSION-ios-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: dist/Void-*-ios-unsigned.ipa
          retention-days: 3

  release:
    needs: [prepare, desktop, android, ios]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            args=(--title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            if [ "$RELEASE_DRAFT" = "true" ]; then
              args+=(--draft)
            fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi
