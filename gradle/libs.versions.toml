[bundles]
compose-multiplatform = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-components-resources",
    "compose-uiToolingPreview",
]

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
